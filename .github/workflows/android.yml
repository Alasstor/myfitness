name: APK de Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "garmin-local/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compila los .py con la misma versión de Python que lleva la app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Firmado con tu clave (las actualizaciones se instalan encima)."
          else
            echo "::warning::No hay secreto KEYSTORE_BASE64: el APK se firma con una clave temporal y para actualizar habrá que desinstalar la versión anterior."
          fi

      - name: Compilar el APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar el archivo
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/MyFitness-1.0.${{ github.run_number }}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: MyFitness-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MyFitness 1.0.${{ github.run_number }}
          body: "APK compilado automáticamente a partir de ${{ github.sha }}. Descárgalo desde el móvil e instálalo."
          files: dist/*.apk
          make_latest: true
